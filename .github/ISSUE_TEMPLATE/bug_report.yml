name: Bug report
description: Report a reproducible problem in OBSIDIAN
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use private reporting for vulnerabilities in OBSIDIAN.
        Never include credentials, customer data or unauthorized target details.
  - type: input
    id: version
    attributes:
      label: OBSIDIAN version
      placeholder: "0.19.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer a disposable local fixture with sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
