name: Native desktop packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: Linux-x64
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
          - os: windows-latest
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-build.txt
      - name: Require a trusted native browser
        run: python -c "from src.adapters.browser_xss import signed_browser; p = signed_browser(); print(p); assert p, 'A trusted browser is required; verification must not be skipped'"
      - name: Run complete test suite against loopback fixtures
        run: python -m pytest tests -q --junitxml=desktop-tests.xml
      - name: Build native application
        run: python build_exe.py
      - name: Verify frozen scanner, Word export and Qt window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python verify_desktop.py dist/Qolam_Sentinel/Qolam_Sentinel.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            python verify_desktop.py dist/Qolam_Sentinel.app/Contents/MacOS/Qolam_Sentinel
          else
            python verify_desktop.py dist/Qolam_Sentinel/Qolam_Sentinel
          fi
      - name: Package verified application with source and licenses
        run: python package_desktop.py
      - name: Upload verified downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            release-desktop/*.zip
            release-desktop/*.tar.gz
            release-desktop/*_SHA256SUMS.txt
            release-desktop/*_VERIFICATION.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
